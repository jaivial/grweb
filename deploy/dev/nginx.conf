user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50M;
  log_format main '$host $remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Map Host header → upstream service
  map $host $backend_upstream {
    default                  backend;
  }
  map $host $frontend_upstream {
    backoffice-grscup-dev.menustudioai.com    backoffice;
    grscup-frontend-dev.menustudioai.com      frontend;
    default                                  backoffice;
  }

  # Backend (ASP.NET Core) — API + SignalR hubs
  upstream backend { server 127.0.0.1:5006; }
  upstream backoffice { server 127.0.0.1:5174; }
  upstream frontend { server 127.0.0.1:5173; }

  # WebSocket upgrade helper (for vite HMR over WSS)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Backoffice server
  server {
    listen 80;
    server_name backoffice-grscup-dev.menustudioai.com;

    location /api/   { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /hubs/  { proxy_pass http://backend/hubs/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }

    location / {
      proxy_pass http://backoffice;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Frontend server
  server {
    listen 80;
    server_name grscup-frontend-dev.menustudioai.com;

    location /api/   { proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /hubs/  { proxy_pass http://backend/hubs/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Default catch-all (returns 404)
  server {
    listen 80 default_server;
    server_name _;
    return 404 "grscup-dev: unknown host $host\n";
  }
}