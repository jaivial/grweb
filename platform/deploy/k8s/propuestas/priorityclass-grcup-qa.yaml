# PROPUESTA perf-20261115 (NO aplicada; requiere OK de Jaime). GRS QA cede ante prod en el nodo único de Kraken:
# prioridad por debajo de las cargas sin clase (0) y sin preempción. Se referencia con
# spec.template.spec.priorityClassName: grcup-qa-baja en los Deployments del overlay qa.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: grcup-qa-baja
value: -100
preemptionPolicy: Never
globalDefault: false
description: "GRS Cup QA: por debajo de prod; nunca desaloja a otros pods."
---
# Quota ajustada a lo que cabe junto a prod (12 CPU en el nodo): limits 8 CPU (hoy 60), requests 4.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: grcup-quota
  namespace: grcup-qa
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "8"
