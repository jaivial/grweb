# PROPUESTA perf-20261115 (NO aplicada; en Kraken requiere OK de Jaime): WebSocket del chat directo al servicio
# chat, sin pasar por el gateway. El cliente no cambia: sigue abriendo wss://<web>/api/competiciones/<slug>/chat/ws
# en su mismo host; solo esta location, más específica que /api/, lo saca del gateway.
#
# Por qué: con 300 WS el túnel WS era ~80 % de la CPU del gateway (pprof: wsBack.Read + netFD.Write). Con
# ?lote=1 baja mucho, pero cada frame sigue cruzando dos procesos y dos sockets. Medición local antes/después en
# ~/orq/perf-20261115/informe.md §5.
#
# Lo que el gateway hacía en el WS y queda cubierto así:
#   - Origin: lo comprueba chat (CHAT_ORIGENES).
#   - Sesión de fan: la verifica chat.
#   - Tope de conexiones: CHAT_MAX_CONEXIONES por pod.
#   - Cierre 1012 al apagar: lo hace chat.
#   - Ritmo de aperturas por IP: lo pone aquí limit_req (antes, bucket gw-sse del gateway).
#   - Cola de entrada (ADMISION_MAX): se aplica en el REST. Un fan en cola no carga la página del chat, pero un
#     cliente que abra el WS a mano no hace cola.
#   - X-GrCup-Service / X-GrCup-Carga: nginx los borra (los clientes nunca los mandan).

# http {}:
limit_req_zone $binary_remote_addr zone=grcup_chat_ws:10m rate=10r/s;  # aperturas de WS por IP

# --- jaime-desktop (conf.d/grcup-qa-desktop.conf, server grcup-qa.menustudioai.com y grcup-qa-api) ---
location ~ ^/api/competiciones/[a-z0-9-]{2,41}/chat/ws$ {
    limit_req zone=grcup_chat_ws burst=50 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18302;           # chat del compose dev (puerto publicado solo en loopback)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-GrCup-Service "";
    proxy_set_header X-GrCup-Carga "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;                      # > CHAT_WS_IDLE_SEG (90 s; el cliente hace ping cada 30 s)
    proxy_buffering off;
}

# --- Kraken (host nginx de grcup-qa): igual, pero con proxy_pass al Service chat ---
#   proxy_pass http://chat.grcup-qa.svc.cluster.local:8080;   (o la ClusterIP; la NetworkPolicy allow-node ya
#   deja pasar al nodo hacia todos los pods). Si el resolver de nginx no ve el DNS del clúster, se usa la ClusterIP
#   fija del Service chat.
