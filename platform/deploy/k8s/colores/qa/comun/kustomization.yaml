# QA: lo común de los dos colores (blue y green). El namespace y las IPs fijas los pone cada color (../blue, ../green).
# Presupuesto y patrones del overlay de QA anterior: prod-20261115 (deploy/k8s/presupuesto.py).
# Réplicas mínimas 1 en QA: el nodo (110 pods) no admite dos colores completos más prod (36 pods); con mínimos de 1
# cada color ocupa ~22 pods. El escalado máximo sigue como en QA.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../color
  - enlaces.yaml # Services ExternalName: postgres, redis, mailpit, evo-weai → capa compartida (grcup-qa)
  - chat-ws.yaml # perf-20261115 §8: Service del WebSocket de chat directo desde nginx (IP fija por color)
patches:
  # prod-20261115: QA quota and floors leave room for production on the same node (deploy/k8s/presupuesto.py).
  - path: recursos.yaml
  - path: chat-memoria.yaml
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - { op: add, path: /spec/minReplicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: gateway }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 4 }
  - target: { kind: HorizontalPodAutoscaler, name: juegos }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 4 }
  - target: { kind: HorizontalPodAutoscaler, name: realtime }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  - target: { kind: HorizontalPodAutoscaler, name: chat }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 4 }
  # chat: ~130 MiB per 1.000 WS measured (perf §7); 512Mi holds ~3.500 WS per pod
  - target: { kind: Deployment, name: chat }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi }
  # ST1-R1-2: authorised load tests send X-GrCup-Carga: <LOADTEST_SECRET> and skip the per-IP bucket (QA only;
  # the Secret grcup-carga is copied into each color by scripts/lib/colores.sh).
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOADTEST_SECRET
          valueFrom: { secretKeyRef: { name: grcup-carga, key: LOADTEST_SECRET, optional: true } }
# The deploy script replaces TAG with the commit being deployed.
images:
  - { name: grcup/ai, newTag: TAG }
  - { name: grcup/athletes, newTag: TAG }
  - { name: grcup/audit, newTag: TAG }
  - { name: grcup/backoffice, newTag: TAG }
  - { name: grcup/chat, newTag: TAG }
  - { name: grcup/cms, newTag: TAG }
  - { name: grcup/competition, newTag: TAG }
  - { name: grcup/crm, newTag: TAG }
  - { name: grcup/donaciones, newTag: TAG }
  - { name: grcup/fans, newTag: TAG }
  - { name: grcup/gateway, newTag: TAG }
  - { name: grcup/identity, newTag: TAG }
  - { name: grcup/juegos, newTag: TAG }
  - { name: grcup/live, newTag: TAG }
  - { name: grcup/messaging, newTag: TAG }
  - { name: grcup/openlifter, newTag: TAG }
  - { name: grcup/patrocinio, newTag: TAG }
  - { name: grcup/raffle, newTag: TAG }
  - { name: grcup/realtime, newTag: TAG }
  - { name: grcup/schedule, newTag: TAG }
  - { name: grcup/ticketing, newTag: TAG }
  - { name: grcup/web, newTag: TAG }
