# perf-20261115 §8: second Service of the chat pods with a fixed ClusterIP per color (set in blue/green kustomization),
# so the host nginx can send ONLY /api/competiciones/<slug>/chat/ws straight to chat (without the gateway).
apiVersion: v1
kind: Service
metadata:
  name: chat-ws
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: grcup }
spec:
  selector: { app.kubernetes.io/name: chat }
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
