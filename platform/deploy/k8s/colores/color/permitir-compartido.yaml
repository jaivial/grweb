# La capa compartida (namespace con grcup.dev/compartido=true) llama a los servicios del color: juegos-worker y el
# webhook de evo-weai (messaging). Solo el puerto HTTP interno.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compartido
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { grcup.dev/compartido: "true" } }
      ports:
        - { port: 8080, protocol: TCP }
