# evo-weai: the WhatsApp service (Evolution API v2 compatible). It is not a Go service of the platform: the image
# comes from the release of its own repository (~/evo-weai · Dockerfile.prebuilt, the version is a build ARG), so the
# deployment here only runs it.
#
#   · one replica and «Recreate»: the WhatsApp session is a single socket (it must not be scaled nor restarted twice).
#   · the state (the SQLite database and the device files) lives in a hostPath of the node, like the other services
#     of the cluster (/var/lib/grcup-qa/evo-weai in QA, /var/lib/grcup/evo-weai in production).
#   · the keys (WEAI_API_KEY, the global key messaging uses as «apikey»; WEAI_DATA_KEY, the encryption at rest) come
#     from the Secret grcup-weai (deploy/scripts/secretos.sh).
#   · no Ingress and no Service of its own outside the cluster: only messaging reaches it (allow-evo-weai).
#
# Its tier is «external» (not «service»): it gets neither the platform config/SMTP patches nor the ingress rules
# opened to every platform service.
#
# The image is built outside the deploy script (another repository and a private release):
#   docker build -f ~/evo-weai/Dockerfile.prebuilt --build-arg EVO_WEAI_REF=v0.2.14 \
#     --secret id=evo_weai_gh_token,env=EVO_WEAI_GH_TOKEN -t grcup/evo-weai:v0.2.14 ~/evo-weai
#   docker save grcup/evo-weai:v0.2.14 | gzip -1 | ssh kraken 'gunzip | sudo k3s ctr -n k8s.io images import -'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evo-weai
  labels: { app.kubernetes.io/name: evo-weai, app.kubernetes.io/part-of: grcup, grcup.dev/tier: external }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: evo-weai }
  # The session is a single socket: the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app.kubernetes.io/name: evo-weai, app.kubernetes.io/part-of: grcup, grcup.dev/tier: external, grcup.dev/servicio: evo-weai }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: permisos
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] }
          volumeMounts:
            - { name: datos, mountPath: /data }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: evo-weai
          image: grcup/evo-weai:v0.2.14
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: WEAI_API_KEY
              valueFrom: { secretKeyRef: { name: grcup-weai, key: WEAI_API_KEY } }
            - name: WEAI_DATA_KEY
              valueFrom: { secretKeyRef: { name: grcup-weai, key: WEAI_DATA_KEY } }
            - { name: WEAI_HOST, value: "0.0.0.0" }
            - { name: WEAI_PORT, value: "8080" }
            - { name: WEAI_DATABASE_PATH, value: "/data/weai.db" }
            # The name the phone shows in «Dispositivos vinculados».
            - { name: WEAI_DEVICE_NAME, value: "GR Cup" }
            # In QA the webhook points to the internal URL of messaging; evo-weai only accepts internal targets with
            # this flag. Production replaces the URL with the public one and turns the flag off.
            - { name: WEAI_WEBHOOK_ALLOW_INTERNAL, value: "true" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          lifecycle:
            preStop: { sleep: { seconds: 5 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: datos, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: datos
          hostPath: { path: /var/lib/grcup-qa/evo-weai, type: DirectoryOrCreate }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: evo-weai
  labels: { app.kubernetes.io/name: evo-weai, app.kubernetes.io/part-of: grcup }
spec:
  selector: { app.kubernetes.io/name: evo-weai }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Only messaging talks to evo-weai (and nobody reaches it from outside).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-evo-weai
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: evo-weai }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { grcup.dev/servicio: messaging } }
      ports:
        - { port: 8080, protocol: TCP }
