# identity: users, sessions, roles. Migrations run in the init container before the new version serves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels: { app.kubernetes.io/name: identity, app.kubernetes.io/part-of: grcup, grcup.dev/tier: service }
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: identity }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: identity, app.kubernetes.io/part-of: grcup, grcup.dev/tier: service, grcup.dev/db: "true" }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: grcup/identity
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: grcup-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: grcup-db, key: PW_IDENTITY } }
            - { name: DATABASE_URL, value: "postgres://grcup_identity:$(DB_PASSWORD)@postgres:5432/grcup_identity?sslmode=disable&$(DB_POOL)" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
      containers:
        - name: identity
          image: grcup/identity
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: grcup-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: grcup-db, key: PW_IDENTITY } }
            - { name: DATABASE_URL, value: "postgres://grcup_identity:$(DB_PASSWORD)@postgres:5432/grcup_identity?sslmode=disable&$(DB_POOL)" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: grcup-redis, key: REDIS_PASSWORD } }
            - name: INTERNAL_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: grcup-internal, key: INTERNAL_TOKEN_SECRET } }
            - name: JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: grcup-jwt, key: private.pem } }
            # 4 concurrent argon2id runs × 19 MiB + baseline: the GC must act well before the cgroup limit.
            - { name: GOMEMLIMIT, value: 400MiB }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels: { app.kubernetes.io/name: identity, app.kubernetes.io/part-of: grcup }
spec:
  selector: { app.kubernetes.io/name: identity }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: identity }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 180 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: identity }
---
# Creates the first Root user of the environment (idempotent). The deploy script recreates it on each run.
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: identity-bootstrap, app.kubernetes.io/part-of: grcup, grcup.dev/db: "true" }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: grcup/identity
          imagePullPolicy: IfNotPresent
          args: ["bootstrap-root"]
          envFrom:
            - configMapRef: { name: grcup-config }
            - secretRef: { name: grcup-root }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: grcup-db, key: PW_IDENTITY } }
            - { name: DATABASE_URL, value: "postgres://grcup_identity:$(DB_PASSWORD)@postgres:5432/grcup_identity?sslmode=disable&$(DB_POOL)" }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: grcup-redis, key: REDIS_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
