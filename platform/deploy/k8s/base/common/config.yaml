# Common, non-secret configuration of every service (overlays replace values per environment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grcup-config
data:
  SERVICE_ENV: qa
  PAGOS_SIMULADOS: "true"   # test gateway (no real charges); never in production
  WHATSAPP_SIMULADO: "true" # campaigns: WhatsApp recorded as delivered while no evo-weai number is linked; never in production
  KEY_PREFIX: "grcup:qa:"
  REDIS_ADDR: redis:16379
  REDIS_USERNAME: grcup
  JWKS_URL: http://identity:8080/.well-known/jwks.json
  JWT_ISSUER: grcup-identity
  LOG_LEVEL: info
  # k8s probes on their own listener (port salud), outside the connection cap of :8080.
  HEALTH_ADDR: ":8081"
  BACKOFFICE_URL: https://grcup-qa-bo.menustudioai.com
  PUBLIC_WEB_URL: https://grcup-qa.menustudioai.com
  PUBLIC_API_URL: https://grcup-qa-api.menustudioai.com
  # The webhook of evo-weai: in QA it points to the internal service (the event does not leave the cluster).
  WHATSAPP_WEBHOOK_URL: http://messaging:8080
  # Platform SMTP (backoffice access, invitations, and competitions without their own SMTP). QA: Mailpit.
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_TLS: "no"
  MAIL_FROM: no-responder@grcup.dev
  MAIL_FROM_NAME: GR Cup
  CORS_ORIGINS: https://grcup-qa.menustudioai.com,https://grcup-qa-bo.menustudioai.com
  # Each pod keeps few connections: 13 services × up to 4 replicas must fit in max_connections.
  DB_POOL: pool_max_conns=5
