# Namespace-wide guard rails: defaults for containers without resources, quota, and network policies.
apiVersion: v1
kind: LimitRange
metadata:
  name: grcup-defaults
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 25m, memory: 32Mi }
      default: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: grcup-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    # Limits are burst caps (every service pod allows 1 CPU); 32 leaves room for the rolling-update surge of all
    # Sized for every HPA at its maximum (services 500m each, gateway and web 1 CPU) plus the extra pod of a
    # rolling update. Limits are ceilings, not reservations: real reservations are bounded by requests.cpu.
    limits.cpu: "40"
    limits.memory: 20Gi
    pods: "80"
---
# Default deny: nothing reaches a pod unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The node itself (host nginx → ClusterIP, kubelet probes) reaches every pod. Host traffic to local pods
# leaves through cni0 (10.42.0.1); the public and tailnet node IPs are listed for completeness.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.42.0.1/32 }
        - ipBlock: { cidr: 65.109.100.94/32 }
        - ipBlock: { cidr: 100.66.235.72/32 }
---
# Each service has its own policy (allow-<service>, generated from LLAMADAS in deploy/k8s/generar.py): the gateway,
# audit (health checks) and only the services that call it.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { grcup.dev/db: "true" } }
      ports:
        - { port: 5432, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mailpit-smtp
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { grcup.dev/tier: service } }
      ports:
        - { port: 1025, protocol: TCP }
---
# The public web renders on the server against the gateway (in-cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: web } }
      ports:
        - { port: 8080, protocol: TCP }
