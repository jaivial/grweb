# QA on kraken (k3s): namespace grcup-qa, tailnet-only subdomains *.menustudioai.com.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grcup-qa
resources:
  - namespace.yaml
  - ../../base
# Fixed ClusterIPs that the host nginx proxies to (no NodePorts: kraken has no firewall).
patches:
  - target: { kind: Service, name: gateway }
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.240.10
  - target: { kind: Service, name: web }
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.240.11
  - target: { kind: Service, name: backoffice }
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.240.12
  - target: { kind: Service, name: mailpit }
    patch: |-
      - op: add
        path: /spec/clusterIP
        value: 10.43.240.25
# The deploy script replaces TAG with the commit being deployed.
images:
  - { name: grcup/athletes, newTag: TAG }
  - { name: grcup/audit, newTag: TAG }
  - { name: grcup/backoffice, newTag: TAG }
  - { name: grcup/cms, newTag: TAG }
  - { name: grcup/competition, newTag: TAG }
  - { name: grcup/crm, newTag: TAG }
  - { name: grcup/gateway, newTag: TAG }
  - { name: grcup/identity, newTag: TAG }
  - { name: grcup/live, newTag: TAG }
  - { name: grcup/messaging, newTag: TAG }
  - { name: grcup/realtime, newTag: TAG }
  - { name: grcup/schedule, newTag: TAG }
  - { name: grcup/ticketing, newTag: TAG }
  - { name: grcup/web, newTag: TAG }
