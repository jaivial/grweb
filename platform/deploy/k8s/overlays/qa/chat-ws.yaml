# perf-20261115 §8: second Service of the chat pods with a fixed ClusterIP, so the host nginx can send ONLY
# /api/competiciones/<slug>/chat/ws straight to chat (without the gateway). The `chat` Service (in-cluster DNS,
# gateway upstream) stays as is. Host → pod traffic is allowed by NetworkPolicy allow-node.
apiVersion: v1
kind: Service
metadata:
  name: chat-ws
  labels: { app.kubernetes.io/name: chat, app.kubernetes.io/part-of: grcup }
spec:
  clusterIP: 10.43.240.13
  selector: { app.kubernetes.io/name: chat }
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
