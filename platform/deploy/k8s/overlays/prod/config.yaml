# Production values over base/common/config.yaml (QA). Domains (decided 30/10/2026): subdomains of menustudioai.com,
# like QA (grcup-qa*), with DNS in Cloudflare (DNS only, A → kraken's public IP: deploy/scripts/dns-cloudflare.sh prod)
# and one Let's Encrypt certificate for the three (DNS-01). webPublica() derives the web from «<x>-bo.». The previous
# domain (grcup.jaimedigitalstudio.com) redirects here at the cutover (deploy/scripts/nginx-prod.sh redirigir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grcup-config
data:
  DOMINIOS_CONFIRMADOS: "si"
  SERVICE_ENV: prod
  PAGOS_SIMULADOS: "false"
  WHATSAPP_SIMULADO: "false"
  KEY_PREFIX: "grcup:prod:"
  REDIS_ADDR: redis:16380
  REDIS_USERNAME: grcup-prod
  WEB_HOST: grcup.menustudioai.com
  PUBLIC_WEB_URL: https://grcup.menustudioai.com
  BACKOFFICE_URL: https://grcup-bo.menustudioai.com
  API_URL: https://grcup-api.menustudioai.com
  CORS_ORIGINS: https://grcup.menustudioai.com,https://grcup-bo.menustudioai.com
  # The previous web's domain: redirected to WEB_HOST at the cutover (FER's Stripe webhook excepted).
  DOMINIO_ANTERIOR: grcup.jaimedigitalstudio.com
  # Platform SMTP (backoffice access, invitations, competitions without their own SMTP). Host here, user and
  # password in the Secret grcup-smtp (SMTP_USER, SMTP_PASSWORD). The sender domain needs SPF, DKIM and DMARC.
  SMTP_HOST: smtp.por-confirmar.invalid
  SMTP_PORT: "587"
  SMTP_TLS: auto
  MAIL_FROM: no-responder@menustudioai.com
  MAIL_FROM_NAME: GR Strength Cup
