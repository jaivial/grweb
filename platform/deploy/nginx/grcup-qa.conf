# GR Cup platform · QA on kraken. Tailnet only: the server blocks listen on kraken's tailnet IP (100.66.235.72;
# other sites already bind that address explicitly, which takes precedence over `listen 443`), DNS points there,
# and nginx still refuses anything outside 100.64.0.0/10. TLS from Let's Encrypt (DNS-01 via Cloudflare). Upstreams are fixed ClusterIPs of grcup-qa.
# Installed by platform/deploy/scripts/nginx-qa.sh.

map $http_upgrade $grcup_qa_connection { default upgrade; '' ''; }

server {
    listen 100.66.235.72:80;
    server_name grcup-qa.menustudioai.com grcup-qa-bo.menustudioai.com grcup-qa-api.menustudioai.com grcup-qa-mail.menustudioai.com;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    return 301 https://$host$request_uri;
}

# API (gateway) — CLI, agents, and the /api of web and backoffice.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-api.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://10.43.240.10:8080;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Public web (Angular SSR) — /api goes to the gateway on the same origin.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 16m;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://10.43.240.10:8080;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    location / {
        proxy_pass http://10.43.240.11:80;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Backoffice (Angular SPA + PWA) — /api goes to the gateway on the same origin (SameSite=Strict cookie).
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-bo.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://10.43.240.10:8080;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    location / {
        proxy_pass http://10.43.240.12:80;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Mailpit — every email sent in QA.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-mail.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://10.43.240.25:8025;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}
