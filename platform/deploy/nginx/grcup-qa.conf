# GR Cup platform · QA on kraken. Tailnet only: the server blocks listen on kraken's tailnet IP (100.66.235.72;
# other sites already bind that address explicitly, which takes precedence over `listen 443`), DNS points there,
# and nginx still refuses anything outside 100.64.0.0/10. TLS from Let's Encrypt (DNS-01 via Cloudflare). Upstreams are fixed ClusterIPs of grcup-qa.
# Installed by platform/deploy/scripts/nginx-qa.sh.

map $http_upgrade $grcup_qa_connection { default upgrade; '' ''; }

# Upstreams grcup_qa_gateway, grcup_qa_web, grcup_qa_bo and grcup_qa_chat: /etc/nginx/conf.d/grcup-qa-upstream.conf
# (el color vivo; plantilla deploy/nginx/grcup-qa-upstream.conf.tpl, conmutada por scripts/lib/colores.sh).
# per-request timings of the API (rt = nginx total, urt/uct = upstream): tells server time from tailnet/client time.
log_format grcup_qa_timing '$time_iso8601 $status $request_method $uri rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';

# Alta de atleta (POST): límite por IP para que un formulario no se llene de peticiones (10 r/min, ráfaga de 5).
limit_req_zone $binary_remote_addr zone=alta_atleta_qa:10m rate=10r/m;
# Openings of the direct chat WS per IP (the gateway's per-IP opening bucket does not see them): a tab reconnects
# at most every 1-30 s with backoff; a venue behind one NAT needs the burst.
limit_req_zone $binary_remote_addr zone=chat_ws_qa:10m rate=10r/s;

server {
    listen 100.66.235.72:80;
    server_name grcup-qa.menustudioai.com grcup-qa-bo.menustudioai.com grcup-qa-api.menustudioai.com grcup-qa-mail.menustudioai.com;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    return 301 https://$host$request_uri;
}

# API (gateway) — CLI, agents, and the /api of web and backoffice.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-api.menustudioai.com;
    access_log /var/log/nginx/grcup-qa-api.timing.log grcup_qa_timing;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 12m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ ^/api/competiciones/[^/]+/alta-atleta$ {
        limit_req zone=alta_atleta_qa burst=5 nodelay;
        limit_req_status 429; # el formulario lo muestra como «demasiadas altas», no como «cerrada»
        client_max_body_size 10m;
        proxy_pass http://grcup_qa_gateway;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    location / {
        proxy_pass http://grcup_qa_gateway;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Public web (Angular SSR) — /api goes to the gateway on the same origin.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa.menustudioai.com;
    # gzip of HTML/JS/CSS/JSON/SVG, proxied SSR included (cdn-20261115: the bundles went out uncompressed, ~2 MB per
    # page). text/event-stream stays out so SSE is never buffered.
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 12m;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/api/competiciones/[^/]+/alta-atleta$ {
        limit_req zone=alta_atleta_qa burst=5 nodelay;
        limit_req_status 429; # el formulario lo muestra como «demasiadas altas», no como «cerrada»
        client_max_body_size 10m;
        proxy_pass http://grcup_qa_gateway;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    # perf-20261115 §8: chat WebSocket straight to chat (Origin, fan session, connection cap and the 1012 drain are
    # chat's own). Internal headers are never accepted from clients.
    location ~ "^/api/competiciones/[a-z0-9-]{2,41}/chat/ws$" {
        limit_req zone=chat_ws_qa burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://grcup_qa_chat;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
        proxy_set_header X-GrCup-Service "";
        proxy_set_header X-GrCup-Carga "";
    }
    location /api/ {
        proxy_pass http://grcup_qa_gateway;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    location / {
        proxy_pass http://grcup_qa_web;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Backoffice (Angular SPA + PWA) — /api goes to the gateway on the same origin (SameSite=Strict cookie).
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-bo.menustudioai.com;
    # gzip of HTML/JS/CSS/JSON/SVG, proxied SSR included (cdn-20261115: the bundles went out uncompressed, ~2 MB per
    # page). text/event-stream stays out so SSE is never buffered.
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 12m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://grcup_qa_gateway;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
    location / {
        proxy_pass http://grcup_qa_bo;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}

# Mailpit — every email sent in QA.
server {
    listen 100.66.235.72:443 ssl;
    http2 on;
    server_name grcup-qa-mail.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://10.43.240.25:8025;
        include /etc/nginx/snippets/grcup-qa-proxy.conf;
    }
}
