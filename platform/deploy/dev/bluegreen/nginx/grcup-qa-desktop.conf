# GRS Cup (grcup-qa*) servido desde jaime-desktop: tailnet only (100.99.184.33), TLS Let's Encrypt (DNS-01 Cloudflare).
# Web publica = SSR Node (grcup-dev-web@blue|green, grcup_web) ; backoffice = estatico /srv/grcup-dev/backoffice (symlink
# a la release viva) ; /api = gateway del color vivo (grcup_api). Los destinos viven en grcup-dev-upstream.conf.

server {
    listen 100.99.184.33:80;
    server_name grcup-qa.menustudioai.com grcup-qa-bo.menustudioai.com grcup-qa-api.menustudioai.com;
    allow 100.64.0.0/10; allow 127.0.0.1; deny all;
    return 301 https://$host$request_uri;
}

server {
    listen 100.99.184.33:443 ssl;
    http2 on;
    server_name grcup-qa-api.menustudioai.com;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10; allow 127.0.0.1; deny all;
    client_max_body_size 12m;
    location ~ ^/api/.+/stream$ {
        include /etc/nginx/grcup-dev/proxy-sse.inc;
        proxy_pass http://grcup_api;
    }
    location / {
        include /etc/nginx/grcup-dev/proxy-api.inc;
        proxy_pass http://grcup_api;
    }
}

server {
    listen 100.99.184.33:443 ssl;
    http2 on;
    server_name grcup-qa.menustudioai.com;
    # cdn-20261115: gzip of HTML/JS/CSS/JSON/SVG (also proxied SSR); text/event-stream stays out (SSE unbuffered).
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10; allow 127.0.0.1; deny all;
    client_max_body_size 12m;
    location ~ ^/api/.+/stream$ {
        include /etc/nginx/grcup-dev/proxy-sse.inc;
        proxy_pass http://grcup_api;
    }
    location /api/ {
        include /etc/nginx/grcup-dev/proxy-api.inc;
        proxy_pass http://grcup_api;
    }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://grcup_web;
    }
}

server {
    listen 100.99.184.33:443 ssl;
    http2 on;
    server_name grcup-qa-bo.menustudioai.com;
    # cdn-20261115: gzip of HTML/JS/CSS/JSON/SVG (also proxied SSR); text/event-stream stays out (SSE unbuffered).
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;
    ssl_certificate /etc/letsencrypt/live/grcup-qa.menustudioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grcup-qa.menustudioai.com/privkey.pem;
    allow 100.64.0.0/10; allow 127.0.0.1; deny all;
    client_max_body_size 12m;
    add_header X-Frame-Options "DENY" always;
    root /srv/grcup-dev/backoffice;
    index index.html;
    location ~ ^/api/.+/stream$ {
        include /etc/nginx/grcup-dev/proxy-sse.inc;
        proxy_pass http://grcup_api;
    }
    location /api/ {
        include /etc/nginx/grcup-dev/proxy-api.inc;
        proxy_pass http://grcup_api;
    }
    # cdn-20261115: hashed bundles (Angular names them by content) are immutable; index.html and routes stay no-store.
    location ~* \.(?:js|css|woff2?|webp|png|jpe?g|svg|ico)$ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Frame-Options "DENY" always; try_files $uri =404; }
    location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
