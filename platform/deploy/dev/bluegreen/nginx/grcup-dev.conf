# GRS Cup backoffice DEV en jaime-desktop (build estatico + proxy /api al gateway del color vivo).
server {
    listen 100.99.184.33:8009;
    listen 127.0.0.1:8009;
    server_name _;
    root /srv/grcup-dev/backoffice;
    index index.html;
    location ~ ^/api/.+/stream$ {
        include /etc/nginx/grcup-dev/proxy-sse.inc;
        proxy_pass http://grcup_api;
    }
    location /api/ {
        include /etc/nginx/grcup-dev/proxy-api.inc;
        proxy_pass http://grcup_api;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
