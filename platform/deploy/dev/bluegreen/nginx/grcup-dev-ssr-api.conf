# SSR → API sin pasar por el puerto del color: el render del SSR llama a 127.0.0.1:18399 y nginx lo manda al gateway
# que tenga grcup_api en ese momento. Así un cambio de API no obliga a reiniciar el SSR, y web y API pueden
# cambiar de color por separado (redeploy --solo-web / --solo-servicios).
server {
    listen 127.0.0.1:18399;
    server_name _;
    location / {
        proxy_pass http://grcup_api;
        proxy_http_version 1.1;
        proxy_set_header Connection $grcup_dev_conn;
        proxy_set_header Host $host;
        proxy_read_timeout 60;
    }
}
