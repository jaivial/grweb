# Local development stack. Mirrors QA: PostgreSQL 17 (one DB per service), Redis 6.0 (same major as kraken), Mailpit.
# make dev-up  → gateway on http://127.0.0.1:18300, Mailpit on http://127.0.0.1:18325
# Every service carries a mem_limit (machine rule: the dev stack shares the laptop with builds).
name: grcup-dev

x-svc: &svc
  restart: unless-stopped
  mem_limit: 256m
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

x-env: &env
  SERVICE_ENV: dev
  AUTO_MIGRATE: "true"
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: dev-redis
  JWKS_URL: http://identity:8080/.well-known/jwks.json
  INTERNAL_TOKEN_SECRET: dev-internal-secret-change-me
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:6.0-alpine
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "dev-redis", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    mem_limit: 256m
    ports:
      - "127.0.0.1:18325:8025"

  identity:
    <<: *svc
    build: { context: ../.., args: { SVC: identity, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_identity:dev_identity@postgres:5432/grcup_identity?sslmode=disable
      BACKOFFICE_URL: http://127.0.0.1:4201
      COOKIE_SECURE: "false"

  identity-bootstrap:
    build: { context: ../.., args: { SVC: identity, VERSION: "${VERSION:-dev}" } }
    command: ["bootstrap-root"]
    restart: "no"
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_identity:dev_identity@postgres:5432/grcup_identity?sslmode=disable
      ROOT_EMAIL: root@grcup.local
      ROOT_PASSWORD: root-dev-password
      ROOT_NOMBRE: Root (dev)

  competition:
    <<: *svc
    build: { context: ../.., args: { SVC: competition, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_competition:dev_competition@postgres:5432/grcup_competition?sslmode=disable

  competition-seed:
    build: { context: ../.., args: { SVC: competition, VERSION: "${VERSION:-dev}" } }
    command: ["seed-grcup"]
    restart: on-failure
    mem_limit: 256m
    depends_on:
      identity-bootstrap: { condition: service_completed_successfully }
      identity: { condition: service_started }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_competition:dev_competition@postgres:5432/grcup_competition?sslmode=disable
      ROOT_EMAIL: root@grcup.local

  audit:
    <<: *svc
    build: { context: ../.., args: { SVC: audit, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_audit:dev_audit@postgres:5432/grcup_audit?sslmode=disable

  realtime:
    <<: *svc
    build: { context: ../.., args: { SVC: realtime, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env

  fans:
    <<: *svc
    build: { context: ../.., args: { SVC: fans, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_fans:dev_fans@postgres:5432/grcup_fans?sslmode=disable
      COOKIE_SECURE: "false"

  chat:
    <<: *svc
    build: { context: ../.., args: { SVC: chat, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_chat:dev_chat@postgres:5432/grcup_chat?sslmode=disable
      CHAT_MAX_CONEXIONES: "10000"

  donaciones:
    <<: *svc
    build: { context: ../.., args: { SVC: donaciones, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_donaciones:dev_donaciones@postgres:5432/grcup_donaciones?sslmode=disable

  patrocinio:
    <<: *svc
    build: { context: ../.., args: { SVC: patrocinio, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_patrocinio:dev_patrocinio@postgres:5432/grcup_patrocinio?sslmode=disable

  juegos:
    <<: *svc
    build: { context: ../.., args: { SVC: juegos, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_juegos:dev_juegos@postgres:5432/grcup_juegos?sslmode=disable

  juegos-worker:
    <<: *svc
    build: { context: ../.., args: { SVC: juegos, VERSION: "${VERSION:-dev}" } }
    command: ["worker"]
    environment:
      <<: *env
      DATABASE_URL: postgres://grcup_juegos:dev_juegos@postgres:5432/grcup_juegos?sslmode=disable

  gateway:
    <<: *svc
    build: { context: ../.., args: { SVC: gateway, VERSION: "${VERSION:-dev}" } }
    environment:
      <<: *env
      UPSTREAMS: identity,competition,audit,realtime,fans,chat,donaciones,patrocinio,juegos
      CORS_ORIGINS: http://127.0.0.1:4200,http://127.0.0.1:4201,http://localhost:4200,http://localhost:4201
    ports:
      - "127.0.0.1:18300:8080"

volumes:
  pgdata:
