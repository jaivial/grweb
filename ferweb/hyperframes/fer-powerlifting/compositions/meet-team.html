<template id="meet-team-template">
  <div data-composition-id="meet-team" data-width="1920" data-height="1080">
    <style>
      #meet-team {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0A1628;
        font-family: system-ui, "Inter", sans-serif;
      }

      #meet-team .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        opacity: 0;
        gap: 32px;
        padding: 80px 160px;
        box-sizing: border-box;
      }

      #meet-team .title {
        font-size: 80px;
        font-weight: 800;
        color: #F8FAFC;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-align: center;
      }

      #meet-team .underline {
        width: 280px;
        height: 5px;
        background: #FBBF24;
        border-radius: 3px;
        transform-origin: left center;
      }

      #meet-team .photo-frame {
        width: 420px;
        height: 540px;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding: 32px;
        box-sizing: border-box;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
      }

      #meet-team .photo-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(10, 22, 40, 0.85) 0%, transparent 60%);
        z-index: 1;
      }

      #meet-team .photo-name {
        font-size: 32px;
        font-weight: 700;
        color: #F8FAFC;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-align: center;
        z-index: 2;
        position: relative;
      }

      #meet-team .photo-role {
        font-size: 20px;
        font-weight: 400;
        color: #94A3B8;
        letter-spacing: 0.06em;
        text-align: center;
        z-index: 2;
        position: relative;
        margin-top: 8px;
      }

      #meet-team .photo1 {
        background: #1E3A5F;
      }

      #meet-team .photo2 {
        background: #3B82F6;
      }

      #meet-team .photo3 {
        background: #8B5CF6;
      }

      #meet-team .photo4 {
        background: #10B981;
      }

      #meet-team .grs-title {
        font-size: 100px;
        font-weight: 900;
        color: #FBBF24;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
        text-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
      }

      #meet-team .grs-subtitle {
        font-size: 32px;
        font-weight: 400;
        color: #94A3B8;
        letter-spacing: 0.1em;
        text-align: center;
      }

      #meet-team .bg-accent {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(251, 191, 36, 0.08) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
    </style>

    <div id="team-main" class="clip" data-start="0" data-duration="10" data-track-index="0">
      <div class="bg-accent" id="bg-accent"></div>

      <div class="scene" id="scene1">
        <div class="title" id="team-title">CONOCE AL EQUIPO</div>
        <div class="underline" id="team-underline"></div>
      </div>

      <div class="scene" id="scene2" data-layout-allow-overflow>
        <div class="photo-frame photo1" id="photo1">
          <div class="photo-name">ATLETA 1</div>
          <div class="photo-role">Peso muerto</div>
        </div>
        <div class="photo-frame photo2" id="photo2">
          <div class="photo-name">ATLETA 2</div>
          <div class="photo-role">Sentadilla</div>
        </div>
        <div class="photo-frame photo3" id="photo3">
          <div class="photo-name">ATLETA 3</div>
          <div class="photo-role">Press de banca</div>
        </div>
        <div class="photo-frame photo4" id="photo4">
          <div class="photo-name">ATLETA 4</div>
          <div class="photo-role">Best jumper</div>
        </div>
      </div>

      <div class="scene" id="scene3" data-layout-allow-overflow>
        <div class="grs-title" id="grs-title">GRS CLUB</div>
        <div class="grs-subtitle" id="grs-subtitle">FER CUP II 2026</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Background accent glow
      tl.fromTo("#bg-accent",
        { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 2.0, ease: "power2.out" },
        0
      );

      // === Scene 1: CONOCE AL EQUIPO (0 - 1.6s) ===
      tl.to("#scene1", { opacity: 1, duration: 0.01 }, 0);
      tl.from("#team-title",
        { y: 60, opacity: 0, duration: 0.7, ease: "power3.out" },
        0.15
      );
      tl.from("#team-underline",
        { scaleX: 0, opacity: 0, duration: 0.6, ease: "expo.out" },
        0.5
      );

      // Transition Scene 1 -> Scene 2 (crossfade 1.6s - 2.1s)
      tl.to("#scene1", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 1.6);
      tl.set("#scene1", { visibility: "hidden" }, 2.1);
      tl.to("#scene2", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 1.6);

      // === Scene 2: Photo slideshow (2.1s - 7.5s) ===
      // All photos start invisible via CSS (.scene opacity: 0)

      // Photo 1: 2.1s - 3.5s (crossfade out at 3.2s)
      tl.from("#photo1",
        { opacity: 0, scale: 1.06, duration: 0.4, ease: "power2.out" },
        2.1
      );
      tl.from("#photo1 .photo-name",
        { y: 20, opacity: 0, duration: 0.35, ease: "power2.out" },
        2.4
      );
      tl.from("#photo1 .photo-role",
        { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" },
        2.55
      );
      tl.to("#photo1", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 3.2);

      // Photo 2: 3.2s - 4.7s (crossfade out at 4.4s)
      tl.from("#photo2",
        { opacity: 0, scale: 1.06, duration: 0.4, ease: "power2.out" },
        3.2
      );
      tl.from("#photo2 .photo-name",
        { y: 20, opacity: 0, duration: 0.35, ease: "power2.out" },
        3.5
      );
      tl.from("#photo2 .photo-role",
        { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" },
        3.65
      );
      tl.to("#photo2", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 4.4);

      // Photo 3: 4.4s - 5.9s (crossfade out at 5.6s)
      tl.from("#photo3",
        { opacity: 0, scale: 1.06, duration: 0.4, ease: "power2.out" },
        4.4
      );
      tl.from("#photo3 .photo-name",
        { y: 20, opacity: 0, duration: 0.35, ease: "power2.out" },
        4.7
      );
      tl.from("#photo3 .photo-role",
        { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" },
        4.85
      );
      tl.to("#photo3", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 5.6);

      // Photo 4: 5.6s - stays visible until scene transition at 7.5s
      tl.from("#photo4",
        { opacity: 0, scale: 1.06, duration: 0.4, ease: "power2.out" },
        5.6
      );
      tl.from("#photo4 .photo-name",
        { y: 20, opacity: 0, duration: 0.35, ease: "power2.out" },
        5.9
      );
      tl.from("#photo4 .photo-role",
        { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" },
        6.05
      );

      // Transition Scene 2 -> Scene 3 (crossfade 7.5s - 8.0s)
      tl.to("#scene2", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
      tl.set("#scene2", { visibility: "hidden" }, 8.0);
      tl.to("#scene3", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.5);

      // === Scene 3: GRS CLUB (8.0s - 10s) ===
      tl.from("#grs-title",
        { scale: 0.7, opacity: 0, duration: 0.7, ease: "back.out(1.5)" },
        7.8
      );
      tl.from("#grs-subtitle",
        { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" },
        8.3
      );

      // Final scene exit (last scene - allowed)
      tl.to("#scene3", { opacity: 0, duration: 0.6, ease: "power2.in" }, 9.4);
      tl.set("#scene3", { visibility: "hidden" }, 10.0);
      tl.to("#bg-accent", { opacity: 0, scale: 1.4, duration: 0.6, ease: "power2.in" }, 9.4);

      window.__timelines["meet-team"] = tl;
    </script>
  </div>
</template>
