<!doctype html>
<html lang="es" data-composition-id="fer-og-image" data-width="1200" data-height="630">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0B0F1A;
        font-family: 'Syne', 'Inter', system-ui, sans-serif;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 1200px;
        height: 630px;
        padding: 60px;
        gap: 20px;
      }
      .logo {
        width: 500px;
        max-width: 70vw;
        height: auto;
      }
      .divider {
        width: 100px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #8B95A5, transparent);
      }
      .title {
        font-size: 88px;
        font-weight: 800;
        color: #F1F5F9;
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1;
      }
      .title span { color: #CBD5E1; }
      .subtitle {
        font-size: 28px;
        font-weight: 400;
        color: #8494A7;
        text-align: center;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .date-chip {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 28px;
        background: rgba(139, 149, 165, 0.1);
        border: 1px solid rgba(139, 149, 165, 0.25);
        border-radius: 100px;
      }
      .date-chip span {
        font-size: 20px;
        font-weight: 600;
        color: #F1F5F9;
        letter-spacing: 0.05em;
      }
      .date-sep { color: #8B95A5; }
    </style>
  </head>
  <body>
    <div data-composition-id="fer-og-image" data-width="1200" data-height="630">
      <div class="scene-content" id="og-content">
        <img
          class="logo clip"
          data-start="0"
          data-duration="2"
          data-track-index="1"
          src="https://jaimedigitalstudio.b-cdn.net/fer/media/logos/fer-cup-logo.webp"
          alt="FER CUP"
          crossorigin="anonymous"
        />
        <div class="divider clip" data-start="0" data-duration="2" data-track-index="1"></div>
        <h1 class="title clip" data-start="0" data-duration="2" data-track-index="2">FER <span>CUP II</span></h1>
        <p class="subtitle clip" data-start="0" data-duration="2" data-track-index="2">Powerlifting Competition</p>
        <div class="date-chip clip" data-start="0" data-duration="2" data-track-index="3">
          <span>25 JULIO 2026</span>
          <span class="date-sep">|</span>
          <span>ALMUSSAFES, VALENCIA</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".logo", { opacity: 0, scale: 0.9, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.from(".divider", { scaleX: 0, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.from(".title", { opacity: 0, y: 20, duration: 0.7, ease: "power3.out" }, 0.4);
      tl.from(".subtitle", { opacity: 0, y: 15, duration: 0.6, ease: "power2.out" }, 0.6);
      tl.from(".date-chip", { opacity: 0, y: 10, duration: 0.5, ease: "power2.out" }, 0.8);
      window.__timelines["fer-og-image"] = tl;
    </script>
  </body>
</html>
