<template id="fer-intro-template">
  <div data-composition-id="fer-intro" data-width="1920" data-height="1080">
    <style>
      #fer-intro {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0A1628;
        font-family: system-ui, "Inter", sans-serif;
      }

      #fer-intro .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        opacity: 0;
        gap: 24px;
        padding: 120px 160px;
        box-sizing: border-box;
      }

      #fer-intro .bg-glow {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }

      #fer-intro .fer-title {
        font-size: 96px;
        font-weight: 800;
        color: #FBBF24;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.1;
      }

      #fer-intro .presenta-text {
        font-size: 72px;
        font-weight: 600;
        color: #F8FAFC;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-shadow: 0 0 40px rgba(96, 165, 250, 0.6),
                     0 0 80px rgba(96, 165, 250, 0.3);
      }

      #fer-intro .powerlifting-title {
        font-size: 110px;
        font-weight: 900;
        color: #3B82F6;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.1;
      }

      #fer-intro .date-text {
        font-size: 36px;
        font-weight: 400;
        color: #94A3B8;
        letter-spacing: 0.1em;
        text-align: center;
      }

      #fer-intro .accent-line {
        width: 160px;
        height: 4px;
        background: #FBBF24;
        border-radius: 2px;
      }
    </style>

    <div id="intro-main" class="clip" data-start="0" data-duration="8" data-track-index="0">
      <div class="bg-glow" id="bg-glow"></div>

      <div class="scene" id="scene1">
        <div class="accent-line" id="s1-line"></div>
        <div class="fer-title" id="fer-title">FER ENTRENAMIENTO</div>
        <div class="accent-line" id="s1-line-bottom"></div>
      </div>

      <div class="scene" id="scene2">
        <div class="presenta-text" id="presenta-text">PRESENTA</div>
      </div>

      <div class="scene" id="scene3">
        <div class="powerlifting-title" id="powerlifting-title">POWERLIFTING DAY</div>
        <div class="date-text" id="date-text">25 JULIO 2026 &bull; ALMUSSAFES</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      tl.fromTo("#bg-glow",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 2.0, ease: "power2.out" },
        0
      );

      // === Scene 1: FER ENTRENAMIENTO (0 - 2.6s) ===
      tl.to("#scene1", { opacity: 1, duration: 0.01 }, 0);
      tl.from("#fer-title",
        { y: 80, opacity: 0, duration: 0.9, ease: "power3.out" },
        0.2
      );
      tl.from("#s1-line",
        { scaleX: 0, opacity: 0, duration: 0.5, ease: "expo.out" },
        0.3
      );
      tl.from("#s1-line-bottom",
        { scaleX: 0, opacity: 0, duration: 0.5, ease: "expo.out" },
        0.5
      );

      // Transition Scene 1 -> Scene 2 (crossfade 2.6s - 3.1s)
      tl.to("#scene1", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.6);
      tl.set("#scene1", { visibility: "hidden" }, 3.1);
      tl.to("#scene2", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2.6);

      // === Scene 2: PRESENTA (3.1s - 5.2s) ===
      tl.from("#presenta-text",
        { opacity: 0, scale: 0.85, duration: 0.7, ease: "expo.out" },
        2.8
      );

      // Glow pulse: one clean up-down cycle
      tl.to("#presenta-text",
        { textShadow: "0 0 80px rgba(96,165,250,1), 0 0 160px rgba(96,165,250,0.6)", duration: 0.5, ease: "sine.out" },
        3.5
      );
      tl.to("#presenta-text",
        { textShadow: "0 0 40px rgba(96,165,250,0.6), 0 0 80px rgba(96,165,250,0.3)", duration: 0.5, ease: "sine.in" },
        4.0
      );

      // Transition Scene 2 -> Scene 3 (crossfade 5.2s - 5.6s)
      tl.to("#scene2", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 5.2);
      tl.set("#scene2", { visibility: "hidden" }, 5.6);
      tl.to("#scene3", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 5.2);

      // === Scene 3: POWERLIFTING DAY (5.6s - 8s) ===
      tl.from("#powerlifting-title",
        { scale: 0.8, opacity: 0, duration: 0.8, ease: "back.out(1.4)" },
        5.4
      );
      tl.from("#date-text",
        { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" },
        6.0
      );

      // Final scene exit (last scene - allowed)
      tl.to("#scene3", { opacity: 0, duration: 0.6, ease: "power2.in" }, 7.4);
      tl.set("#scene3", { visibility: "hidden" }, 8.0);
      tl.to("#bg-glow", { opacity: 0, scale: 1.3, duration: 0.6, ease: "power2.in" }, 7.4);

      window.__timelines["fer-intro"] = tl;
    </script>
  </div>
</template>
